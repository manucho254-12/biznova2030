{% extends 'auth_base.html' %}
{% from '_icons.html' import icon %}
{% block title %}Forgot Password — BizNova{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Forgot Your Password?</h2>
  <p class="form-card-subtitle">Enter the email on your account and we'll send you a new password.</p>
  <form method="POST" action="{{ url_for('forgot_password') }}">
    <div class="form-group">
      <label>{{ icon('mail', 14) }} Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>
    </div>
    <button type="submit" class="btn">Send New Password</button>
  </form>
  <p class="form-footer"><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
