{% extends 'auth_base.html' %}
{% from '_icons.html' import icon %}
{% block title %}Login — BizNova{% endblock %}
{% block content %}
<div class="form-card">
  <h2>Welcome Back</h2>
  <p class="form-card-subtitle">Log in to continue earning.</p>
  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label>{{ icon('user', 14) }} Username, Email, or Phone</label>
      <input type="text" name="identifier" required>
    </div>
    <div class="form-group">
      <label>{{ icon('lock', 14) }} Password</label>
      <div class="password-input-group">
        <input type="password" name="password" id="login_password" required>
        <button type="button" class="password-toggle" onclick="togglePassword('login_password', this)">{{ icon('eye', 16) }}</button>
      </div>
      <p class="field-hint" style="text-align:right;"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
  <p class="form-footer">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePassword(fieldId, btn) {
  const input = document.getElementById(fieldId);
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  btn.innerHTML = showing
    ? `{{ icon("eye", 16) }}`
    : `{{ icon("eye-off", 16) }}`;
}
</script>
{% endblock %}
